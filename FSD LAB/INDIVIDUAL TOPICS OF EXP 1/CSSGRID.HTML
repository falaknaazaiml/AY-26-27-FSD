<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: 150px 150px 150px;
    gap: 10px;
    background-color: lightgray;
    padding: 10px;
}

.item {
    background-color: steelblue;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 20px;
}
</style>
</head>
<body>

<div class="container">
    <div class="item">F</div>
    <div class="item">A</div>
    <div class="item">L</div>
    <div class="item">A</div>
    <div class="item">K</div>
    
</div>

</body>
</html>
