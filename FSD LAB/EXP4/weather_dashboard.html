<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(6,8,10,0.85), transparent 6%),
                        linear-gradient(180deg,#000 0%, #050507 70%);
            color: #d3eaf6;
            min-height: 100vh;
            padding: 24px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 84px 1fr;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
            border-radius: 1000px;
            padding: 16px 8px;
            height: calc(100vh - 48px);
            box-shadow: 0 10px 30px rgba(2,6,12,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        .sidebar .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: radial-gradient(circle at 30% 30%, rgba(0,200,255,0.07), rgba(0,120,155,0.03));
            box-shadow: 0 10px 30px rgba(0,200,255,0.04), inset 0 1px 0 rgba(255,255,255,0.02);
            backdrop-filter: blur(6px);
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display:flex;align-items:center;justify-content:center;
            color:#8aa4c7; cursor:pointer;
            background: transparent; border: none;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(10,30,48,0.75), rgba(4,12,22,0.6));
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 28px rgba(0,160,255,0.08) inset;
            color: #e6fbff;
            border: 1px solid rgba(127,224,255,0.06);
        }

        /* Main area */
        .main-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        header {
            display:flex;align-items:center;justify-content:space-between;gap:16px;
        }

        h1 {
            color: #e6f2ff;
            font-weight:600;
            font-size:20px;
        }

        .search-box {
            display:flex;gap:10px;align-items:center;
        }

        .search-box select {
            padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);
            background: rgba(255,255,255,0.02); color:#cfe6ff; min-width:220px;
        }

        .search-box button {
            padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(180deg,#061422,#042034);
            color:#9fe7ff; cursor:pointer; box-shadow:0 6px 18px rgba(0,120,200,0.08);
        }

        #message {text-align:left;color:#9fb8d0;font-size:14px;margin-top:6px}

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 18px;
        }

        .current-weather {
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
            padding: 28px; border-radius: 16px; color: #e6f3ff;
            box-shadow: 0 28px 80px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.02);
            position:relative; overflow:hidden;
        }

        .current-weather:before {
            content: ""; position:absolute; right:-120px; top:-40px; width:420px; height:420px;
            background: radial-gradient(circle at 30% 30%, rgba(6,20,30,0.5), transparent 28%);
            transform: rotate(18deg); pointer-events:none; opacity:0.95; mix-blend-mode:overlay;
        }

        #location {font-size:20px;margin-bottom:6px;color:#cfe6ff}

        .temperature {font-size:56px;font-weight:700;color:#7ff3ff;text-shadow:0 6px 24px rgba(0,140,200,0.12)}

        #description {font-size:15px;color:#9fb8d0;margin:10px 0 18px}

        .details {display:flex;gap:28px;color:#9fb8d0}

        .highlights {
            display:grid;grid-template-columns:1fr 1fr;gap:12px;
        }

        .highlight-card {background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            padding:16px;border-radius:12px;color:#e6f3ff;box-shadow:0 10px 28px rgba(0,0,0,0.6);
        }

        .forecast-title {color:#cfe6ff;margin-bottom:8px;font-weight:600}

        .forecast {display:grid;grid-template-columns: repeat(5, 1fr); gap:12px}

        .forecast-card {background:linear-gradient(180deg, rgba(255,255,255,0.008), rgba(255,255,255,0.004));
            padding:14px;border-radius:12px;text-align:center;color:#d9eeff;border:1px solid rgba(255,255,255,0.03);
        }

        .forecast-card h3 {margin-bottom:6px;color:#bfe9ff}

        .forecast-card .temp {font-size:18px;font-weight:700;color:#72d8ff}

        .hidden {display:none}

        @media (max-width: 1024px) {
            .app-grid {grid-template-columns:64px 1fr}
            .dashboard-grid {grid-template-columns:1fr}
            .forecast {grid-template-columns: repeat(3, 1fr)}
        }

        @media (max-width:700px){
            .forecast {grid-template-columns: repeat(2,1fr)}
            .sidebar {display:none}
        }

    </style>

</head>


<body>

    <div class="app-grid">

        <aside class="sidebar">
            <div class="logo" title="Weathry"></div>
            <button class="nav-btn active" aria-label="Overview">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <circle cx="12" cy="10" r="3" stroke="#8fefff" stroke-width="1.2" fill="rgba(127,224,255,0.06)"/>
                    <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#8fefff" stroke-width="1" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="nav-btn" aria-label="Map">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <path d="M3 6l6-2 6 2 6-2v12l-6 2-6-2-6 2V6z" stroke="#8aa4c7" stroke-width="1" fill="rgba(140,170,200,0.02)"/>
                </svg>
            </button>
            <button class="nav-btn" aria-label="Locations">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z" stroke="#8aa4c7" stroke-width="1" fill="rgba(140,170,200,0.02)"/>
                    <circle cx="12" cy="9" r="2" fill="#8fefff"/>
                </svg>
            </button>
            <div style="flex:1"></div>
            <button class="nav-btn" aria-label="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                    <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" stroke="#8aa4c7" stroke-width="1" fill="rgba(140,170,200,0.02)"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a1 1 0 0 1-1.4 1.4l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.6V20a1 1 0 0 1-2 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1A1 1 0 0 1 6.3 18l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.6-1H4a1 1 0 0 1 0-2h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.8L5.4 7.3A1 1 0 0 1 6.8 5.9l.1.1a1.7 1.7 0 0 0 1.8.3c.5-.3 1-.7 1-1.6V4a1 1 0 0 1 2 0v.2c0 .9.5 1.3 1 1.6.8.4 1.4.2 1.8-.3l.1-.1A1 1 0 0 1 17.7 6l-.1.1a1.7 1.7 0 0 0-.3 1.8c.3.5.7 1 1.6 1H20a1 1 0 0 1 0 2h-.2c-.9 0-1.3.5-1.6 1z" stroke="#8aa4c7" stroke-width="0.8" fill="rgba(140,170,200,0.02)"/>
                </svg>
            </button>
        </aside>

        <div class="main-area">

            <header>
                <h1>
                    <svg width="20" height="20" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:8px" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                        <defs>
                            <radialGradient id="g1" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#7ff3ff" stop-opacity="0.9"/>
                                <stop offset="100%" stop-color="#033" stop-opacity="0.2"/>
                            </radialGradient>
                        </defs>
                        <circle cx="12" cy="10" r="4" fill="url(#g1)" stroke="#7fe0ff" stroke-opacity="0.3"/>
                    </svg>
                    Weather Forecast Dashboard
                </h1>

                <div class="search-box">
                    <select id="citySelect">
                        <option value="">-- Select a City --</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Pune">Pune</option>
                        <option value="Vijayawada">Vijayawada</option>
                        <option value="Visakhapatnam">Visakhapatnam</option>
                        <option value="Tirupati">Tirupati</option>
                        <!-- International Cities -->
                        <option value="New York">New York, USA</option>
                        <option value="London">London, UK</option>
                        <option value="Tokyo">Tokyo, Japan</option>
                        <option value="Sydney">Sydney, Australia</option>
                        <option value="Toronto">Toronto, Canada</option>
                        <option value="Paris">Paris, France</option>
                        <option value="Berlin">Berlin, Germany</option>
                        <option value="Moscow">Moscow, Russia</option>
                        <option value="Dubai">Dubai, UAE</option>
                        <option value="Beijing">Beijing, China</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Cape Town">Cape Town, South Africa</option>
                        <option value="Sao Paulo">Sao Paulo, Brazil</option>
                        <option value="Mexico City">Mexico City, Mexico</option>
                        <option value="Istanbul">Istanbul, Turkey</option>
                        <option value="Seoul">Seoul, South Korea</option>
                        <option value="Bangkok">Bangkok, Thailand</option>
                        <option value="Rome">Rome, Italy</option>
                        <option value="Amsterdam">Amsterdam, Netherlands</option>
                        <option value="Zurich">Zurich, Switzerland</option>
                    </select>

                    <button id="searchBtn">Get Weather</button>
                </div>
            </header>

            <p id="message"></p>

            <div class="dashboard-grid">

                <div>
                    <div id="weather" class="hidden">

                        <div class="current-weather">
                            <h2 id="location"></h2>

                            <div class="temperature">
                                <span id="temperature"></span>°C
                            </div>

                            <p id="description"></p>

                            <div class="details">

                                <div>
                                    <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:6px" aria-hidden>
                                        <path d="M12 2C12 2 6 8 6 12a6 6 0 1 0 12 0c0-4-6-10-6-10z" fill="#7fe0ff" opacity="0.95"/>
                                    </svg>
                                    <strong>Humidity</strong>
                                    <span id="humidity"></span>%
                                </div>

                                <div>
                                    <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:6px" aria-hidden>
                                        <path d="M3 12h13a3 3 0 0 0 0-6 3 3 0 0 0-2.83 2H6" stroke="#9fe7ff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3 17h9a2 2 0 1 0 0-4H3" stroke="#9fe7ff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <strong>Wind</strong>
                                    <span id="wind"></span> km/h
                                </div>
                            </div>
                        </div>

                        <h2 class="forecast-title">5-Day Forecast</h2>

                        <div id="forecast" class="forecast"></div>

                        <div style="margin-top:14px;background:transparent;border-radius:12px;padding:12px;border:1px dashed rgba(255,255,255,0.03);">
                            <div style="color:#cfe6ff;font-weight:600;margin-bottom:8px">Trends</div>
                            <canvas id="tempChart" height="100"></canvas>
                            <canvas id="windChart" height="80" style="margin-top:10px"></canvas>
                        </div>

                    </div>
                </div>

                <div>
                    <div class="highlights">
                        <div class="highlight-card">
                            <div style="font-size:12px;color:#9fb8d0">Wind Status</div>
                            <div style="font-size:20px;font-weight:700;color:#9fe7ff" id="wind-highlight">-- km/h</div>
                        </div>

                        <div class="highlight-card">
                            <div style="font-size:12px;color:#9fb8d0">Humidity</div>
                            <div style="font-size:20px;font-weight:700;color:#9fe7ff" id="humidity-highlight">-- %</div>
                        </div>

                        <div class="highlight-card">
                            <div style="font-size:12px;color:#9fb8d0">UV Index</div>
                            <div style="font-size:20px;font-weight:700;color:#9fe7ff" id="uv-index">—</div>
                        </div>

                        <div class="highlight-card">
                            <div style="font-size:12px;color:#9fb8d0">Sunrise & Sunset</div>
                            <div style="font-size:14px;color:#cfe6ff" id="sun-times">—</div>
                        </div>
                    </div>
                </div>

            </div>

                <div style="grid-column:1 / -1;margin-top:12px;display:flex;gap:12px;align-items:flex-start">
                    <div style="flex:1;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)">
                        <div style="color:#cfe6ff;font-weight:600;margin-bottom:8px">Recommendations</div>
                        <div id="recommendations" style="color:#9fb8d0">—</div>
                    </div>

                    <div style="width:220px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)">
                        <div style="color:#cfe6ff;font-weight:600;margin-bottom:8px">Safety Tips</div>
                        <ul style="color:#9fb8d0;font-size:13px;margin-left:16px" id="safetyTips">
                            <li>Check forecasts regularly</li>
                            <li>Carry emergency kit</li>
                        </ul>
                    </div>
                </div>

        </div>

    </div>


    <script>
